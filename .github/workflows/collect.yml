name: collect

# Hourly: record every GitHub Actions run that completed in the organisation since the last
# collection, and push the new record files. Records are append-only: each collection writes new
# files and never rewrites old ones. Each collection resumes from state/cursor.json (minus six
# hours of overlap for long runs), and the cursor moves only past runs actually recorded, so a
# failed push or an exhausted API budget loses nothing.
#
# API budget. The organisation completes about 1,500 runs an hour that reach a runner, and each
# needs one call for its jobs, plus one call per 100 runs listed. The collector sizes its budget from
# the token's live rate limit and records build workflows first, leaving the rest to later hours if
# it runs short. If `github.token` proves too small, set COLLECTOR_APP_ID / COLLECTOR_APP_PRIVATE_KEY
# (an App installed on the organisation) to use an installation token instead.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      since: { description: "Backfill from (e.g. 72h, or an ISO time); empty resumes from the cursor", required: false, default: "" }
      until: { description: "Until (ISO time; default now)", required: false, default: "" }

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Check for the App
        id: app
        env:
          APP_ID: ${{ secrets.COLLECTOR_APP_ID }}
        run: echo "present=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        if: steps.app.outputs.present == 'true'
        continue-on-error: true
        with:
          app-id: ${{ secrets.COLLECTOR_APP_ID }}
          private-key: ${{ secrets.COLLECTOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Collect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          MAX_CALLS: "4500"
        run: |
          args=()
          [ -n "${{ inputs.since }}" ] && args+=(--since "${{ inputs.since }}")
          [ -n "${{ inputs.until }}" ] && args+=(--until "${{ inputs.until }}")
          python3 -m collector.collect "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          git config user.name "tauceti-ci-collector"
          git config user.email "tauceti-ci-collector@users.noreply.github.com"
          git add records state
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "records: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
