name: collect

# Bounded metadata discovery, then resumable jobs/artifact enrichment. Checkpoints
# publish completed batches during the run; the 30-minute soft deadline leaves
# room for final publication before the 55-minute runner timeout.

on:
  push:
    branches: [main]
    paths: ['collector/**', '.github/workflows/collect.yml']
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:
    inputs:
      since: { description: "Backfill from (e.g. 72h, or an ISO time); empty resumes from the cursor", required: false, default: "" }
      until: { description: "Until (ISO time; default now)", required: false, default: "" }

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout pinned shared collector
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiTools
          ref: 4c7381d3a47fd9b9f7aa786dd2a28c375e36fee6
          path: .tauceti-tools
          persist-credentials: false
      - name: Use the shared collector
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.tauceti-tools" >> "$GITHUB_ENV"
      - name: Check for the App
        id: app
        env:
          APP_ID: ${{ secrets.COLLECTOR_APP_ID }}
        run: echo "present=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        if: steps.app.outputs.present == 'true'
        continue-on-error: true
        with:
          app-id: ${{ secrets.COLLECTOR_APP_ID }}
          private-key: ${{ secrets.COLLECTOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Restore the derived record index
        uses: actions/cache/restore@v4
        with:
          path: .cache/collector.sqlite
          key: collector-index-v2-${{ github.run_id }}
          restore-keys: collector-index-v2-

      - name: Collect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          BACKFILL_SINCE: ${{ inputs.since }}
          BACKFILL_UNTIL: ${{ inputs.until }}
        run: |
          set -o pipefail
          args=()
          [ -n "$BACKFILL_SINCE" ] && args+=(--since "$BACKFILL_SINCE")
          [ -n "$BACKFILL_UNTIL" ] && args+=(--until "$BACKFILL_UNTIL")
          python3 -m collector.incremental --push --max-calls 4500 --max-seconds 1800 \
            "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish remaining completed batches
        id: checkpoint
        if: ${{ always() && !cancelled() }}
        run: python3 -m collector.checkpoint

      - name: Save the derived record index
        if: ${{ always() && !cancelled() && steps.checkpoint.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/collector.sqlite
          key: collector-index-v2-${{ github.run_id }}
