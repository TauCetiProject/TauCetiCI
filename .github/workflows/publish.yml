name: publish

# Explicitly rebuild the historical SQLite export and modelling report.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout pinned shared collector
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiTools
          ref: a8b16c3dd0c0730a1963052cb520808e161222ef
          path: .tauceti-tools
          persist-credentials: false
      - name: Use the shared collector
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.tauceti-tools" >> "$GITHUB_ENV"
      - name: Build the database
        run: |
          python3 -m collector.build_db --out db/ci.sqlite
          sqlite3 db/ci.sqlite "SELECT 'runs', COUNT(*) FROM runs UNION ALL SELECT 'jobs', COUNT(*) FROM jobs;" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          gzip -9 -k db/ci.sqlite
          python3 -m analysis.report --db db/ci.sqlite --out db/REPORT.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view db >/dev/null 2>&1 \
            || gh release create db --title "CI database" \
                 --notes "SQLite database of every recorded CI run. Rebuilt after collection from records/; see README."
          gh release upload db db/ci.sqlite.gz db/REPORT.md --clobber
