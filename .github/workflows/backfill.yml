name: backfill

# One bounded, checkpointed pass. Re-dispatching the same range resumes its
# inventory cursor and deferred jobs; it never claims general coverage across gaps.
on:
  workflow_dispatch:
    inputs:
      from: { description: "First UTC day (YYYY-MM-DD)", required: true }
      to: { description: "Last UTC day inclusive (YYYY-MM-DD)", required: true }
      jobs_for: { description: "build or all", required: false, default: "build" }
permissions:
  contents: write
  actions: read
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore the derived record index
        uses: actions/cache/restore@v4
        with:
          path: .cache/collector.sqlite
          key: collector-index-v2-${{ github.run_id }}
          restore-keys: collector-index-v2-
      - name: Backfill one bounded pass
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          JOBS_FOR: ${{ inputs.jobs_for }}
        run: |
          set -euo pipefail
          first=$(date -u -d "$FROM" +%F)
          end=$(date -u -d "$TO + 1 day" +%F)
          case "$JOBS_FOR" in build|all) ;; *) echo "bad jobs_for"; exit 1 ;; esac
          python3 -m collector.incremental --push --repos TauCeti --since "$first" --until "$end" \
            --jobs-for "$JOBS_FOR" --max-calls 4500 --max-seconds 1800 \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish remaining completed batches
        id: checkpoint
        if: ${{ always() && !cancelled() }}
        run: python3 -m collector.checkpoint
      - name: Save the derived record index
        if: ${{ always() && !cancelled() && steps.checkpoint.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/collector.sqlite
          key: collector-index-v2-${{ github.run_id }}
