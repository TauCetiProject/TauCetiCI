name: collect resources

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Optional comma-separated completed TauCeti run IDs; empty samples recent runs"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: collect-resources
  cancel-in-progress: false

jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned shared collector
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiTools
          ref: c81692e993326a127d46115052080bf5c38e8b99
          path: .tauceti-tools
          persist-credentials: false
      - name: Use the shared collector
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.tauceti-tools" >> "$GITHUB_ENV"
      - name: Check for the collector App
        id: app
        env:
          APP_ID: ${{ secrets.COLLECTOR_APP_ID }}
        run: echo "present=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        if: steps.app.outputs.present == 'true'
        continue-on-error: true
        with:
          app-id: ${{ secrets.COLLECTOR_APP_ID }}
          private-key: ${{ secrets.COLLECTOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Collect bounded resource sample
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RESOURCE_RUN_IDS: ${{ inputs.runs }}
        run: |
          set -o pipefail
          python3 -m collector.refresh_resources | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit and push append-only observations
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "tauceti-ci-collector"
          git config user.email "tauceti-ci-collector@users.noreply.github.com"
          git add records
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "records: bounded resource refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git fetch -q origin main || { sleep $((i * 10)); continue; }
            git rebase origin/main || { git rebase --abort; exit 1; }
            git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
