name: Benchmark harness tests
on:
  push:
    paths: [README.md, benchmarks/**, tests/test_benchmark.py, .github/workflows/runner-benchmark.yml, .github/workflows/benchmark-tests.yml]
  pull_request:
    paths: [README.md, benchmarks/**, tests/test_benchmark.py, .github/workflows/runner-benchmark.yml, .github/workflows/benchmark-tests.yml]
permissions:
  contents: read
jobs:
  harness:
    # Same complete suite as collector tests. The provisioned Namespace shape
    # keeps experimental validation independent of the GitHub-hosted queue.
    # No cache volume, publication secret or status permission is present.
    runs-on: [nscloud-ubuntu-24.04-amd64-8x16-with-features, 'namespace-features:container.privileged=true']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q collector analysis benchmarks
      - run: bash -n benchmarks/run.sh
