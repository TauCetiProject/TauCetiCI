name: Benchmark harness tests
on:
  push:
    paths: [README.md, benchmarks/**, tests/test_benchmark.py, .github/workflows/runner-benchmark.yml, .github/workflows/benchmark-tests.yml]
  pull_request:
    paths: [README.md, benchmarks/**, tests/test_benchmark.py, .github/workflows/runner-benchmark.yml, .github/workflows/benchmark-tests.yml]
permissions:
  contents: read
jobs:
  harness:
    # Same complete suite as collector tests on GitHub-hosted capacity.
    # No cache volume, publication secret or status permission is present.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned shared collector
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiTools
          ref: a8b16c3dd0c0730a1963052cb520808e161222ef
          path: .tauceti-tools
          persist-credentials: false
      - name: Use the shared collector
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.tauceti-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install .tauceti-tools
          python -m unittest discover -s tests
      - run: python -m compileall -q collector analysis benchmarks
      - run: bash -n benchmarks/run.sh
      # The Namespace sizing experiment is retired; retain analysis and harness
      # tests above without provisioning its historical workload on another host.
