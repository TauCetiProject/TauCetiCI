name: Benchmark harness tests
on:
  push:
    paths: [README.md, benchmarks/**, tests/test_benchmark.py, .github/workflows/runner-benchmark.yml, .github/workflows/benchmark-tests.yml]
  pull_request:
    paths: [README.md, benchmarks/**, tests/test_benchmark.py, .github/workflows/runner-benchmark.yml, .github/workflows/benchmark-tests.yml]
permissions:
  contents: read
jobs:
  harness:
    # Same complete suite as collector tests. The provisioned Namespace shape
    # keeps experimental validation independent of the GitHub-hosted queue.
    # No cache volume, publication secret or status permission is present.
    runs-on: [nscloud-ubuntu-24.04-amd64-8x16-with-features, 'namespace-features:container.privileged=true']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned shared collector
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiTools
          ref: 4c7381d3a47fd9b9f7aa786dd2a28c375e36fee6
          path: .tauceti-tools
          persist-credentials: false
      - name: Use the shared collector
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.tauceti-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install .tauceti-tools
          python -m unittest discover -s tests
      - run: python -m compileall -q collector analysis benchmarks
      - run: bash -n benchmarks/run.sh
      - uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCeti
          ref: 4f1a681d10b8371c56bc49158b0481d18bd949f5
          path: gate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCeti
          ref: 4f1a681d10b8371c56bc49158b0481d18bd949f5
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete preparation and sandbox readiness without TauCeti compilation
        env:
          HARNESS_SHA: ${{ github.workflow_sha }}
        run: python3 -m benchmarks.preflight
