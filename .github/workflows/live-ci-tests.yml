name: live CI service tests
on:
  push:
    paths: ['services/live-ci/**', '.github/workflows/live-ci-tests.yml']
  pull_request:
    paths: ['services/live-ci/**', '.github/workflows/live-ci-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/live-ci
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned shared collector
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiTools
          ref: 0f4096297f058bff8ccd873067aab7120202aecf
          path: .tauceti-tools
          persist-credentials: false
      - name: Use the shared collector
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.tauceti-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/live-ci/package-lock.json
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
