name: collector tests
on:
  push:
    paths: ['collector/**', 'analysis/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['collector/**', 'analysis/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned shared collector
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiTools
          ref: 4c7381d3a47fd9b9f7aa786dd2a28c375e36fee6
          path: .tauceti-tools
          persist-credentials: false
      - name: Use the shared collector
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.tauceti-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install .tauceti-tools
          python -m unittest discover -s tests
      - run: python -m compileall -q collector analysis
