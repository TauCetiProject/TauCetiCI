name: collector tests
on:
  push:
    paths: ['collector/**', 'analysis/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['collector/**', 'analysis/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned shared collector
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiTools
          ref: c81692e993326a127d46115052080bf5c38e8b99
          path: .tauceti-tools
          persist-credentials: false
      - name: Use the shared collector
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.tauceti-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q collector analysis
