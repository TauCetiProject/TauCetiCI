name: collector tests
on:
  push:
    paths: ['collector/**', 'analysis/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['collector/**', 'analysis/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q collector analysis
