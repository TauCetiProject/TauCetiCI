name: collector tests
on:
  push:
    paths: ['collector/**', 'analysis/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['collector/**', 'analysis/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
# Linux jobs run on the fleet's TauCetiInfra runners (native-disk slots on our own
# machines) when the repository variable FLEET_INFRA_CI is 'true', and on GitHub-hosted
# ubuntu-24.04 otherwise: unset or change that variable to fall back. Fork pull requests
# always run hosted.
jobs:
  tests:
    runs-on: ${{ vars.FLEET_INFRA_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('{"group":"TauCetiInfra","labels":["self-hosted","linux","x64","tauceti-fleet-infra"]}') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned shared collector
        uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiTools
          ref: a8b16c3dd0c0730a1963052cb520808e161222ef
          path: .tauceti-tools
          persist-credentials: false
      - name: Use the shared collector
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.tauceti-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install .tauceti-tools
          python -m unittest discover -s tests
      - run: python -m compileall -q collector analysis
